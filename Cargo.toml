[package]
name = "streaming-gif"
version = "0.1.0"
edition = "2024"

[lints.clippy]
pedantic = "warn"
nursery = "warn"

[dependencies]
http-body-util = "0.1"
hyper = { version = "1.11", features = ["server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
rand = "0.10.2"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
